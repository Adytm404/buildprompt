# buildprompt — template Docker Compose
#
# Dua mode pemakaian:
#   1. Pakai database eksternal (default): isi kredensial lewat file .env,
#      lalu jalankan `docker compose up -d backend`.
#   2. Pakai database lokal (untuk pengembangan): jalankan dengan profil `local-db`
#      `docker compose --profile local-db up -d` sehingga service `db` ikut hidup.
#
# Salin `.env.example` menjadi `.env` di root repo lalu sesuaikan nilainya.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: buildprompt/backend:latest
    container_name: buildprompt-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      PORT: "8080"
      # Database (default: database eksternal dari .env)
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-sagara123_prd_db}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-sagara123_prd}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      DATABASE_URL: ${DATABASE_URL:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      # AI provider (server-side only)
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:20128/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-cmc/deepseek/deepseek-v4.1-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-180}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5199}
      # Kuota paket gratis
      FREE_DAILY_LIMIT: ${FREE_DAILY_LIMIT:-1}
      FREE_MONTHLY_LIMIT: ${FREE_MONTHLY_LIMIT:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - buildprompt

  # Database lokal opsional. Aktif hanya saat profil `local-db` dipakai.
  db:
    image: postgres:16-alpine
    container_name: buildprompt-db
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-buildprompt}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-buildprompt}
      POSTGRES_DB: ${LOCAL_DB_NAME:-buildprompt}
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - buildprompt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-buildprompt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildprompt

volumes:
  buildprompt-db-data:

networks:
  buildprompt:
    driver: bridge
